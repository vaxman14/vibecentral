# Supabase CLI configuration for HQ.
# Local dev: `npx supabase start`; deploy the sync function with `npm run functions:deploy`.
project_id = "hq"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
# HQ does its own auth in the Worker (Google sign-in + passkeys); Supabase Auth is unused.
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false

# The sync function authenticates with its own x-hq-sync-key header (pg_cron and the Worker send it),
# so the gateway must not require a Supabase JWT.
[functions.sync]
verify_jwt = false
entrypoint = "./functions/sync/index.ts"
import_map = "./functions/sync/deno.json"
